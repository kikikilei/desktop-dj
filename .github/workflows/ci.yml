name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install build dependencies
        run: python3 -m pip install Pillow==11.3.0
      - name: Run regression tests
        run: ./Scripts/run_tests.sh
      - name: Build and verify distributable
        run: ./build.sh
